<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Agent Tool</title>
    <link rel="stylesheet" href="tab.css">
    <link rel="stylesheet" href="detection.css">
  </head>
  <body>
    <header>
      <button id="close-settings" class="chip" type="button">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" d="M11.5 4.5 6 10l5.5 5.5"/>
        </svg>
        <span data-i18n="back"></span>
      </button>
      <h1 data-i18n="tabTitle"></h1>
      <button id="open-settings" class="chip" type="button">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="10" cy="10" r="2.7"/>
            <path d="M10 1.9v2.2M10 15.9v2.2M18.1 10h-2.2M4.1 10H1.9
                     M15.7 4.3l-1.5 1.5M5.8 14.2l-1.5 1.5M15.7 15.7l-1.5-1.5M5.8 5.8 4.3 4.3"/>
          </g>
        </svg>
        <span data-i18n="tabSettings"></span>
      </button>
    </header>

    <main>
      <!-- 導入直後だけ出る。一覧は設定の中にあるので、そこまでの導線をここに置く。 -->
      <p id="done" class="done" role="status" hidden>
        <span id="done-text"></span>
        <button id="done-open" class="link" type="button" data-i18n="tabOpenCollection"></button>
      </p>

      <!-- 検知したとき。出すのは種類と名前だけ。取得元と導入先は次の段で見せる。 -->
      <section id="found" hidden>
        <div id="found-card" class="card" aria-busy="false">
          <div class="found-head">
            <span id="found-kind" class="kind"></span>
            <h2 id="found-name"></h2>
            <span id="found-installed" class="installed-tag" hidden data-i18n="tabInstalledShort"></span>
          </div>

          <div id="destination" hidden>
            <code id="found-repo" class="repo" translate="no"></code>
            <div class="choose">
              <label for="target" data-i18n="tabTargetLabel"></label>
              <select id="target"></select>
            </div>
            <code id="target-path" class="repo" translate="no"></code>
            <div class="permission-note" role="note">
              <strong data-i18n="tabPermissionTitle"></strong>
              <p id="permission-note"></p>
            </div>
            <div class="security-summary" aria-labelledby="security-title">
              <strong id="security-title" data-i18n="tabSecurityTitle"></strong>
              <ul>
                <li id="security-source"></li>
                <li data-i18n="tabSecurityPaths"></li>
                <li data-i18n="tabSecurityRollback"></li>
              </ul>
            </div>
            <p id="picker-hint" class="hint"></p>
          </div>

          <p id="status" class="status" role="status"></p>

          <div class="actions">
            <button id="install" class="primary" type="button" data-i18n="tabInstall"></button>
            <button id="dismiss" type="button" data-i18n="tabDismiss"></button>
          </div>
        </div>
      </section>

      <!-- Skill が並ぶディレクトリ。行ごとに 1 件ずつ入れる。まとめては入れない。 -->
      <section id="index" hidden>
        <div class="card">
          <div class="found-head">
            <span class="kind" data-i18n="kindSkill"></span>
            <h2 id="index-title"></h2>
          </div>
          <code id="index-repo" class="repo" translate="no"></code>
          <div class="choose">
            <label for="index-target" data-i18n="tabTargetLabel"></label>
            <select id="index-target"></select>
          </div>
          <code id="index-path" class="repo" translate="no"></code>
          <div class="security-summary" aria-labelledby="index-security-title">
            <strong id="index-security-title" data-i18n="tabSecurityTitle"></strong>
            <ul>
              <li id="index-security-source"></li>
              <li data-i18n="tabSecurityPaths"></li>
              <li data-i18n="tabSecurityRollback"></li>
            </ul>
          </div>
          <p id="index-hint" class="hint"></p>
          <p id="index-status" class="status" role="status"></p>
          <ul id="index-list"></ul>
          <div class="actions">
            <button id="index-dismiss" type="button" data-i18n="tabDismiss"></button>
          </div>
        </div>
      </section>

      <!--
        案内文は `label` にしない。中に「対応サイト」を開くボタンを差し込むので、
        `label` のままだと入力欄のアクセシブル名にボタン文言が混ざり、
        文字を押したときの転送先も曖昧になる。名前は `aria-label` で別に与える。
      -->
      <section id="url-section">
        <p id="url-label"></p>
        <input id="url" type="url" inputmode="url" name="url"
               autocomplete="off" spellcheck="false" aria-describedby="url-error">
        <p id="url-error" class="error" aria-live="polite" hidden data-i18n="tabUrlUnsupported"></p>
      </section>

      <section id="ai-scan" class="card" hidden>
        <strong data-i18n="aiScanTitle"></strong>
        <p class="hint" data-i18n="aiScanText"></p>
        <p id="ai-scan-status" class="status" role="status"></p>
        <div class="actions">
          <button id="ai-scan-button" class="primary" type="button" data-i18n="aiScanButton"></button>
        </div>
      </section>

      <!-- 設定。別タブへ飛ばさず、ここで完結させる。 -->
      <section id="settings-view" hidden>
        <h2 data-i18n="settingsTitle"></h2>
        <p id="hint" class="hint"></p>

        <div class="section-label" data-i18n="settingsRoots"></div>
        <div id="roots"></div>
        <p id="settings-status" class="status" role="status"></p>

        <div class="section-label" data-i18n="settingsBehavior"></div>
        <div id="prefs">
          <label class="switch">
            <input id="auto-open" type="checkbox">
            <span data-i18n="tabAutoOpenToggle"></span>
          </label>
        </div>

        <div class="section-label" data-i18n="aiSettingsTitle"></div>
        <div id="ai-settings">
          <label class="switch">
            <!-- 鍵が保存されるまで押せない。既定を非活性にして、初期化の順序に依存させない。 -->
            <input id="jev-enabled" type="checkbox" disabled>
            <span data-i18n="aiEnabledLabel"></span>
          </label>
          <label for="jev-api-key">
            <a href="https://typesafe.ai/" target="_blank" rel="noreferrer noopener"
               data-i18n="aiApiKeyLabel"></a>
          </label>
          <!-- 鍵の有無で入れ替える。保存済みの値は読み戻さず、消す導線だけを出す。 -->
          <div class="inline-input" id="jev-key-entry">
            <input id="jev-api-key" type="password" autocomplete="off" spellcheck="false">
            <button id="jev-save" type="button" data-i18n="aiSaveKey"></button>
          </div>
          <div class="inline-input" id="jev-key-saved" hidden>
            <span class="saved" data-i18n="aiKeyStored"></span>
            <button id="jev-delete" type="button" data-i18n="aiDeleteKey"></button>
          </div>
          <p class="hint" data-i18n="aiPrivacyNote"></p>
          <p id="jev-status" class="status" role="status"></p>
        </div>

        <!--
          配色。3 つから 1 つなので radio にする（checkbox は 3 つとも入る状態を作れる）。
          値は `color-scheme` にそのまま入る。見出しはセクションラベルが担い、
          fieldset の legend は支援技術のためだけに置く (視覚的には隠す)。
        -->
        <div class="section-label" data-i18n="tabThemeLabel"></div>
        <fieldset id="theme">
          <legend class="visually-hidden" data-i18n="tabThemeLabel"></legend>
          <label class="switch">
            <input type="radio" name="theme" value="light dark">
            <span data-i18n="tabThemeSystem"></span>
          </label>
          <label class="switch">
            <input type="radio" name="theme" value="light">
            <span data-i18n="tabThemeLight"></span>
          </label>
          <label class="switch">
            <input type="radio" name="theme" value="dark">
            <span data-i18n="tabThemeDark"></span>
          </label>
        </fieldset>

        <!--
          ここから導入したもの。普段は畳んでおく。開閉は `details` に任せる。
          `<span>` を分けて置くのは、右端に件数バッジを載せるため。件数は
          `renderCollection` が `#collection-count` に入れる。
        -->
        <details id="collection-section">
          <summary>
            <span class="summary-title" data-i18n="tabCollection"></span>
            <span id="collection-count" class="count-badge" aria-hidden="true"></span>
          </summary>
          <button id="verify" type="button" hidden data-i18n="tabVerify"></button>
          <ul id="collection"></ul>
          <p id="collection-empty" class="empty" data-i18n="tabCollectionEmpty"></p>
        </details>
      </section>
    </main>

    <dialog id="supported-sites" aria-labelledby="supported-sites-title">
      <div class="dialog-head">
        <h2 id="supported-sites-title" data-i18n="tabSupportedSites"></h2>
        <button id="close-sites" class="clear" type="button" data-i18n="close"></button>
      </div>
      <p class="lead" data-i18n="tabSupportedSitesText"></p>
      <ul id="sites-list" class="sites-list"></ul>
    </dialog>
    <script type="module" src="tab.js"></script>
  </body>
</html>
