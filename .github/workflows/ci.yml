name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 3 OS で同じスクリプトを回す。Windows は junction / hardlink が実機でしか
  # 検証できないので必須にする（設計決定 D-10）。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: ./scripts/check-invariants.sh
      # 組み立てた形でしか分からないもの（manifest と HTML が指す先、ESM の import 先、
      # コードが使う i18n キー）を検査する。`tsc --noEmit` では出ない。
      - run: npm run package:browser
      - run: ./scripts/release-changelog.sh --check
      - run: ./scripts/test-release-changelog.sh
      # VSIX サイズは完了条件なので、Cursor E2E（リポジトリ変数に依存する）とは別に測る。
      # stat の書式は OS で違うので、ローカルと同じ Node で測る。
      - run: npm run package
      - name: Check VSIX size
        run: node -e "process.exit(require('node:fs').statSync('vsix/agent-tool.vsix').size < 20971520 ? 0 : 1)"

  # Cursor Stable は macOS でのみ起動する。
  cursor:
    if: vars.CURSOR_URL != '' && vars.CURSOR_SHA256 != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run package
      # 取得元とハッシュはリポジトリ変数に固定する。
      - name: Install pinned Cursor Stable
        env:
          CURSOR_URL: ${{ vars.CURSOR_URL }}
          CURSOR_SHA256: ${{ vars.CURSOR_SHA256 }}
        run: |
          curl -fsSL "$CURSOR_URL" -o cursor.dmg
          echo "$CURSOR_SHA256  cursor.dmg" | shasum -a 256 -c -
          hdiutil attach -quiet -nobrowse -mountpoint /Volumes/Cursor cursor.dmg
          cp -R /Volumes/Cursor/Cursor.app /Applications/
          hdiutil detach -quiet /Volumes/Cursor
          echo "CURSOR_PATH=/Applications/Cursor.app/Contents/Resources/app/bin/cursor" >> "$GITHUB_ENV"
      - run: npm run test:cursor
