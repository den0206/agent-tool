name: Release

on:
  push:
    branches: ["release/Ver_*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./scripts/check-invariants.sh
      - run: ./scripts/release-changelog.sh --check
      - run: ./scripts/test-release-changelog.sh
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/Ver_}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::ブランチ '$GITHUB_REF_NAME' が release/Ver_X.Y.Z 形式ではありません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          MANIFEST_VERSION="${RELEASE_VERSION%%-*}" node -e "const fs=require('node:fs'); const file='browser/manifest.json'; const manifest=JSON.parse(fs.readFileSync(file, 'utf8')); manifest.version=process.env.MANIFEST_VERSION; fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\\n')"
      - name: Cut changelog section
        run: ./scripts/release-changelog.sh "${{ steps.version.outputs.version }}" "$(date -u +%F)"
      - name: Package VSIX
        run: npm run package
      - name: Check VSIX size and checksum
        run: |
          test "$(stat -c %s vsix/agent-tool.vsix)" -lt 20971520
          sha256sum vsix/agent-tool.vsix | tee vsix/agent-tool.vsix.sha256
      - name: Package browser extension and checksum
        run: |
          npm run package:browser
          sha256sum vsix/agent-tool-browser.zip | tee vsix/agent-tool-browser.zip.sha256
      - name: Submit browser extension to Chrome Web Store
        # alpha / beta はGitHub Releasesだけに公開する。ストアは安定版だけへ出す。
        if: ${{ !contains(steps.version.outputs.version, '-') && env.CHROME_CLIENT_ID != '' && env.CHROME_CLIENT_SECRET != '' && env.CHROME_REFRESH_TOKEN != '' && env.CHROME_PUBLISHER_ID != '' && env.CHROME_EXTENSION_ID != '' }}
        run: |
          access_token="$(curl --fail --silent --show-error https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CHROME_CLIENT_ID" \
            --data-urlencode "client_secret=$CHROME_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CHROME_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token' | node -e "let body=''; process.stdin.on('data', chunk => body += chunk).on('end', () => { const token = JSON.parse(body).access_token; if (!token) process.exit(1); process.stdout.write(token) })")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            -X POST -T vsix/agent-tool-browser.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:upload"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:publish"
      - name: Publish stable release to Open VSX
        if: ${{ !contains(steps.version.outputs.version, '-') && env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.2.0 publish vsix/agent-tool.vsix -p "$OVSX_PAT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "Ver_${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Agent Tool ${{ steps.version.outputs.version }}" \
            --notes-file <(./scripts/release-changelog.sh --section "${{ steps.version.outputs.version }}") \
            vsix/agent-tool.vsix vsix/agent-tool.vsix.sha256 \
            vsix/agent-tool-browser.zip vsix/agent-tool-browser.zip.sha256
      - name: Sync version to main
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -f -C main origin/main
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          MANIFEST_VERSION="${RELEASE_VERSION%%-*}" node -e "const fs=require('node:fs'); const file='browser/manifest.json'; const manifest=JSON.parse(fs.readFileSync(file, 'utf8')); manifest.version=process.env.MANIFEST_VERSION; fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\\n')"
          ./scripts/release-changelog.sh "$RELEASE_VERSION" "$(date -u +%F)"
          git add package.json package-lock.json browser/manifest.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: Ver_${RELEASE_VERSION} の版と CHANGELOG を反映 [skip ci]"
          git push origin main
