version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # @types/vscode は package.json の engines.vscode と同じ版に固定する。
      # 上げると宣言と型が食い違うので、engines を上げるときに手で揃える。
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
